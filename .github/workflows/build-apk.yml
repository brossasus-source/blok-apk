name: APK Derle
run-name: apk-${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'İş numarası (10 hex karakter)'
        required: true
      ad:
        description: 'Uygulama adı'
        required: true
        default: 'Uygulamam'

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ID: ${{ inputs.id }}
      AD: ${{ inputs.ad }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Kalıcı imza anahtarı
        run: |
          if [ ! -f android/ugco.keystore ]; then
            keytool -genkeypair -keystore android/ugco.keystore -storepass ugcoapk123 -keypass ugcoapk123 -alias ugco -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=UGCO APK, O=UGCO, C=TR"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add android/ugco.keystore
            git commit -q -m "imza anahtarı oluşturuldu"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break || sleep 3; done
          fi

      - name: Uygulamayı hazırla
        run: |
          set -e
          [[ "$ID" =~ ^[a-f0-9]{10}$ ]] || { echo "Geçersiz id"; exit 1; }
          cp "jobs/$ID/index.html" android/app/src/main/assets/index.html
          if [ -f "jobs/$ID/icon.png" ]; then
            mkdir -p android/app/src/main/res/drawable
            cp "jobs/$ID/icon.png" android/app/src/main/res/drawable/ic_launcher.png
            sed -i 's|<application|<application android:icon="@drawable/ic_launcher"|' android/app/src/main/AndroidManifest.xml
          fi
          YON=$(grep -o 'name="ugco-yon" content="[a-z]*"' "jobs/$ID/index.html" | sed 's/.*content="//;s/"//')
          case "$YON" in
            portrait|landscape) sed -i "s|android:name=\".MainActivity\"|android:name=\".MainActivity\" android:screenOrientation=\"$YON\"|" android/app/src/main/AndroidManifest.xml ;;
          esac
          M() { grep -o "name=\"$1\" content=\"[^\"]*\"" "jobs/$ID/index.html" | head -1 | sed 's/.*content="//;s/"$//'; }
          PKG=$(M ugco-paket); SURUM=$(M ugco-surum); TAM=$(M ugco-tam)
          if [ -z "$PKG" ]; then PKG=tr.ugco.blokapp; fi
          if [ -z "$SURUM" ]; then SURUM=1; fi
          RE='^(com\.ugco\.[a-z][a-z0-9]{2,29}|tr\.ugco\.blokapp)$'
          [[ "$PKG" =~ $RE ]] || { echo "Geçersiz paket adı: $PKG"; exit 1; }
          [[ "$SURUM" =~ ^[0-9]{1,4}$ ]] || { echo "Geçersiz sürüm: $SURUM"; exit 1; }
          sed -i "s/applicationId '[^']*'/applicationId '$PKG'/; s/versionCode [0-9]*/versionCode $SURUM/; s/versionName '[^']*'/versionName '$SURUM.0'/" android/app/build.gradle
          if [ "$TAM" = "1" ]; then sed -i 's|Theme.Material.Light.NoActionBar|Theme.Material.Light.NoActionBar.Fullscreen|' android/app/src/main/AndroidManifest.xml; fi
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "SURUM=$SURUM" >> "$GITHUB_ENV"
          if grep -q 'name="ugco-kamera"' "jobs/$ID/index.html"; then
            sed -i 's|<uses-permission android:name="android.permission.VIBRATE" />|&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />|' android/app/src/main/AndroidManifest.xml
          fi
          if grep -q 'name="ugco-mikrofon"' "jobs/$ID/index.html"; then
            sed -i 's|<uses-permission android:name="android.permission.VIBRATE" />|&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />|' android/app/src/main/AndroidManifest.xml
            sed -i 's|<application|<queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent></queries>\n    <application|' android/app/src/main/AndroidManifest.xml
          fi
          if grep -q 'name="ugco-konum"' "jobs/$ID/index.html"; then
            sed -i 's|<uses-permission android:name="android.permission.VIBRATE" />|&\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />|' android/app/src/main/AndroidManifest.xml
          fi
          if [ -d "jobs/$ID/img" ]; then
            mkdir -p android/app/src/main/assets/img
            cp -r jobs/$ID/img/. android/app/src/main/assets/img/
          fi
          if grep -q 'name="ugco-internet"' "jobs/$ID/index.html"; then
            sed -i 's|<uses-permission android:name="android.permission.VIBRATE" />|&\n    <uses-permission android:name="android.permission.INTERNET" />|' android/app/src/main/AndroidManifest.xml
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          fi
          python3 - <<'PY'
          import os, re
          ad = re.sub(r'[^0-9A-Za-zÇĞİÖŞÜçğıöşü _.\-]', '', os.environ.get('AD', ''))[:30].strip() or 'Uygulamam'
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="app_name">%s</string></resources>\n' % ad
          open('android/app/src/main/res/values/strings.xml', 'w', encoding='utf-8').write(xml)
          PY

      - name: İmza ayarı
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  ugco {
                      storeFile file('../ugco.keystore')
                      storePassword 'ugcoapk123'
                      keyAlias 'ugco'
                      keyPassword 'ugcoapk123'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.ugco }
              }
          }
          GRADLE

      - name: APK derle
        working-directory: android
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > ../gradle.log 2>&1
          KOD=$?
          if [ $KOD -ne 0 ]; then
            echo "---- Gradle çıktısının son satırları ----"
            tail -n 60 ../gradle.log
            OZET=$(grep -E "error:|What went wrong|Execution failed|AAPT|FAILED|Manifest merger|^> " ../gradle.log | head -n 12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle hatası::${OZET}"
          else
            tail -n 3 ../gradle.log
          fi
          exit $KOD

      - name: APK'yı yayınla
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$PKG-v$SURUM.apk"
          gh release create "apk-$ID" "$PKG-v$SURUM.apk" --title "apk-$ID" --notes "Otomatik üretildi"

      - name: İş dosyasını temizle
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -- android
          git rm -r -q "jobs/$ID"
          git commit -q -m "iş $ID temizlendi"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break || sleep 3; done

      - name: Eski APK kayıtlarını temizle (son 20 kalsın)
        continue-on-error: true
        run: |
          gh release list --limit 100 --json tagName --jq '.[20:][].tagName' | while read t; do gh release delete "$t" --cleanup-tag -y || true; done
