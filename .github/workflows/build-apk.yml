name: APK Derle
run-name: apk-${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'İş numarası (10 hex karakter)'
        required: true
      ad:
        description: 'Uygulama adı'
        required: true
        default: 'Uygulamam'

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ID: ${{ inputs.id }}
      AD: ${{ inputs.ad }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Uygulamayı hazırla
        run: |
          set -e
          [[ "$ID" =~ ^[a-f0-9]{10}$ ]] || { echo "Geçersiz id"; exit 1; }
          cp "jobs/$ID/index.html" android/app/src/main/assets/index.html
          if [ -f "jobs/$ID/icon.png" ]; then
            mkdir -p android/app/src/main/res/drawable
            cp "jobs/$ID/icon.png" android/app/src/main/res/drawable/ic_launcher.png
            sed -i 's|<application|<application android:icon="@drawable/ic_launcher"|' android/app/src/main/AndroidManifest.xml
          fi
          python3 - <<'PY'
          import os, re
          ad = re.sub(r'[^0-9A-Za-zÇĞİÖŞÜçğıöşü _.\-]', '', os.environ.get('AD', ''))[:30].strip() or 'Uygulamam'
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="app_name">%s</string></resources>\n' % ad
          open('android/app/src/main/res/values/strings.xml', 'w', encoding='utf-8').write(xml)
          PY

      - name: APK derle
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: APK'yı yayınla
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "uygulama-$ID.apk"
          gh release create "apk-$ID" "uygulama-$ID.apk" --title "apk-$ID" --notes "Otomatik üretildi"

      - name: İş dosyasını temizle
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git rm -r -q "jobs/$ID"
          git commit -q -m "iş $ID temizlendi"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break || sleep 3; done
